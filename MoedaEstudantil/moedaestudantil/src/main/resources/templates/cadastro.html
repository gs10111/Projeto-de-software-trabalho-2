<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Usuário</title>
    <!-- Adicionando o link para o Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2>Cadastro de Usuário</h2>

    <!-- Formulário com classes do Bootstrap -->
    <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}" />
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" />
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" class="form-control" id="cpf" th:field="*{cpf}" />
        </div>

        <div class="form-group">
            <label for="rg">RG:</label>
            <input type="text" class="form-control" id="rg" th:field="*{rg}" />
        </div>

        <div class="form-group">
            <label for="endereco">Endereço:</label>
            <input type="text" class="form-control" id="endereco" th:field="*{endereco}" />
        </div>

        <div class="form-group">
            <label for="curso">Curso:</label>
            <input type="text" class="form-control" id="curso" th:field="*{curso}" />
        </div>

        <div class="form-group">
            <label for="instituicao">Instituição:</label>
            <input type="text" class="form-control" id="instituicao" th:field="*{instituicao}" />
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" class="form-control" id="senha" th:field="*{senha}" />
        </div>

        <div class="form-group">
            <label for="role">Tipo de Usuário:</label>
            <select class="form-control" id="tipo" th:field="*{tipo}">
                <option value="ALUNO">Aluno</option>
                <option value="PROFESSOR">Professor</option>
                <option value="EMPRESA">Empresa</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>

    <!-- Adicionando o script do Bootstrap (necessário para alguns componentes interativos) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
