<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro - Moeda Estudantil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="text-center mb-4">Escolha seu tipo de cadastro</h4>
                    <form id="userTypeForm">
                        <div class="mb-3">
                            <label for="userType" class="form-label">Sou um(a):</label>
                            <select class="form-select" id="userType" required>
                                <option value="">Selecione</option>
                                <option value="aluno">Aluno</option>
                                <option value="professor">Professor</option>
                                <option value="empresa">Empresa Parceira</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Continuar</button>
                        </div>
                        <div class="text-center mt-3">
                            <a href="/login">Voltar ao login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('userTypeForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const tipo = document.getElementById('userType').value;
        if (tipo) {
            window.location.href = `/cadastro/${tipo}`;
        }
    });
</script>

</body>
</html>
