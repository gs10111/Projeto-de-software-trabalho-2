<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">Editar Usuário</h1>

    <!-- O formulário usa o objeto usuario vindo do Controller -->
    <form th:action="@{/usuarios/editar/{id}(id=${usuario.id})}" th:object="${usuario}" method="post">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="mb-3">
            <label class="form-label">Curso</label>
            <input type="text" class="form-control" th:field="*{curso}">
        </div>

        <div class="mb-3">
            <label class="form-label">Instituição</label>
            <input type="text" class="form-control" th:field="*{instituicao}">
        </div>

        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" th:field="*{senha}">
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/usuarios" class="btn btn-secondary">Voltar</a>
    </form>
</div>

</body>
</html>
