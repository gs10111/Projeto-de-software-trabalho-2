<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Aluno - Moeda Estudantil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="mb-4 text-center">Cadastro de Aluno</h4>

                    <form method="post" th:action="@{/cadastro/aluno}" th:object="${aluno}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" th:field="*{nome}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">CPF</label>
                                <input type="text" class="form-control" th:field="*{cpf}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">RG</label>
                                <input type="text" class="form-control" th:field="*{rg}" required>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Endereço</label>
                                <input type="text" class="form-control" th:field="*{endereco}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Curso</label>
                                <input type="text" class="form-control" th:field="*{curso}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Instituição de Ensino</label>
                                <select class="form-select" th:field="*{instituicao.id}" required>
                                    <option value="">Selecione</option>
                                    <option th:each="inst : ${instituicoes}" th:value="${inst.id}" th:text="${inst.nome}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" th:field="*{senha}" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Cadastrar</button>
                        </div>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Voltar ao login</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
